name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  docs:
    name: Build documentation
    env:
      DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      JULIA_DEBUG: Documenter
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
          token: ${{ github.token }}
          ssh-strict: false
      - uses: julia-actions/setup-julia@latest
        with:
          version: 'lts'
      - uses: julia-actions/cache@v3
      # XXX: Julia 1.10 ignores [sources]; develop the unregistered KernelInterface instead
      - run: |
          git clone --depth 1 --branch tb/ki-0.3 https://github.com/JuliaGPU/KernelAbstractions.jl ka
          for project in . docs; do
            julia --project=$project -e 'using Pkg; Pkg.develop(path="ka/lib/KernelInterface")'
          done
      - uses: julia-actions/julia-buildpkg@latest
      - run: julia --project=docs/ docs/make.jl
