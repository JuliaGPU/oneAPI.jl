# Commit message tags select what to run: `[only X]` runs only the listed steps, `[skip X]`
# skips them, where X is a comma-separated list of: `tests` (all steps), `julia` (released
# Julia versions), `nightly`, `special`. To limit the load on the shared GPU runner, pull
# requests only test the oldest and newest supported Julia release; the other versions
# (including nightly) are tested on branch builds, or when selected explicitly with
# `[only X]`. Draft pull requests only test the newest Julia release. See also
# GPUCompiler.jl's CI, which uses the same tags.
steps:
  # Test supported Julia versions
  - group: ":julia: Julia"
    key: "julia"
    steps:
      # the newest release, also tested on draft pull requests
      - &julia
        label: "Julia {{matrix.julia}}"
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-test#v1:
              test_args: "--quickfail"
          - JuliaCI/julia-coverage#v1:
              dirs:
                - src
                - lib
                - examples
        agents:
          queue: "oneapi"
        commands: |
          # XXX: KernelAbstractions 0.10 and KernelInterface 0.4 aren't registered yet.
          #      Julia 1.10 ignores [sources], and Julia 1.11 doesn't pick them up for the
          #      test environment, so check them out and develop them.
          if [[ "{{matrix.julia}}" == "1.10" || "{{matrix.julia}}" == "1.11" ]]; then
            git clone --depth 1 --branch vc/ki-subgroup-ops https://github.com/JuliaGPU/KernelAbstractions.jl ka
            julia --project -e 'using Pkg; Pkg.develop([PackageSpec(; path) for path in ("ka", "ka/lib/KernelInterface")])'
          fi
          julia --project=deps deps/build_ci.jl
          # The julia-test plugin instantiates the project before these commands, which fails
          # on Julia 1.10, so that step runs the tests here instead.
          if [[ "{{matrix.julia}}" == "1.10" ]]; then
            julia --project -e 'using Pkg; Pkg.test(; coverage=true, test_args=`--quickfail`)'
          fi
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ || build.message !~ /\[only /)
        timeout_in_minutes: 120
        matrix:
          setup:
            julia:
              - "1.13"

      # the oldest supported release
      - <<: *julia
        plugins:
          - JuliaCI/julia#v1:
              version: "{{matrix.julia}}"
          - JuliaCI/julia-coverage#v1:
              dirs:
                - src
                - lib
                - examples
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        matrix:
          setup:
            julia:
              - "1.10"

      # intermediate releases, not tested on pull requests
      - <<: *julia
        if: |
          build.message !~ /\[skip [^\]]*(tests|julia)/ &&
          (build.message =~ /\[only [^\]]*(tests|julia)/ ||
           build.message !~ /\[only / && build.pull_request.id == null)
        matrix:
          setup:
            julia:
              - "1.11"
              - "1.12"

      - <<: *julia
        # not tested on pull requests
        if: |
          build.message !~ /\[skip [^\]]*(tests|nightly)/ &&
          (build.message =~ /\[only [^\]]*(tests|nightly)/ ||
           build.message !~ /\[only / && build.pull_request.id == null)
        soft_fail: true
        matrix:
          setup:
            julia:
              - "nightly"

  # Special tests
  - group: ":eyes: Special"
    depends_on: "julia"
    steps:
      - label: "Validation"
        plugins:
          - JuliaCI/julia#v1:
              version: "1.13"
          - JuliaCI/julia-test#v1:
              julia_args: "-g2"
          - JuliaCI/julia-coverage#v1:
              codecov: true
              dirs:
                - src
                - lib
                - examples
        command: |
          julia --project=deps deps/build_ci.jl
          julia --project -e '
              # use debug JLLs, for asserts + better backtraces
              using oneAPI
              oneAPI.set_debug!(true)'
        env:
          ZE_ENABLE_VALIDATION_LAYER: '1'
          ZE_ENABLE_PARAMETER_VALIDATION: '1'
          EnableDebugBreak: '0'
        agents:
          queue: "oneapi"
        if: |
          build.message !~ /\[skip [^\]]*(tests|special)/ &&
          (build.message =~ /\[only [^\]]*(tests|special)/ ||
           build.message !~ /\[only / && !build.pull_request.draft)
        timeout_in_minutes: 60

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: "eager" # OK to downloading JLLs from GitHub
